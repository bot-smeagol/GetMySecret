name: Encrypt File with Secret

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: "Chemin du fichier texte à chiffrer (ex: data/secret.txt)"
        required: true
        default: "secret.txt"
      commit_result:
        description: "Commiter le fichier chiffré dans le repo ?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  push:
    paths:
      - "secret.txt" # Déclenche automatiquement si ce fichier change

jobs:
  encrypt:
    name: Chiffrer le fichier texte
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour commiter le fichier chiffré

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Résoudre le chemin selon le déclencheur
      # -------------------------------------------------------
      - name: Définir le chemin du fichier cible
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FILE_PATH="secret.txt"
          else
            FILE_PATH="${{ github.event.inputs.file_path }}"
          fi
          echo "file_path=$FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "enc_path=${FILE_PATH}.enc"   >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # Vérifier que le fichier source existe
      # -------------------------------------------------------
      - name: Vérifier l'existence du fichier source
        run: |
          FILE="${{ steps.vars.outputs.file_path }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier introuvable : $FILE"
            exit 1
          fi
          echo "Fichier trouvé : $FILE ($(wc -c < "$FILE") octets)"

      # -------------------------------------------------------
      # Chiffrement AES-256-CBC avec PBKDF2
      # Le mot de passe provient du secret GitHub « crypt_passwd »
      # -------------------------------------------------------
      - name: Chiffrer le fichier (AES-256-CBC / PBKDF2)
        env:
          CRYPT_PASSWD: ${{ secrets.crypt_passwd }}
        run: |
          FILE="${{ steps.vars.outputs.file_path }}"
          ENC="${{ steps.vars.outputs.enc_path }}"

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 600000 \
            -in  "$FILE" \
            -out "$ENC" \
            -pass env:CRYPT_PASSWD

          echo "Fichier chiffré généré : $ENC"
          echo "SHA-256 : $(sha256sum "$ENC")"

      # -------------------------------------------------------
      # Upload du fichier chiffré comme artefact de CI
      # (disponible dans l'onglet « Summary » du workflow)
      # -------------------------------------------------------
      - name: Uploader le fichier chiffré en artefact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-file
          path: ${{ steps.vars.outputs.enc_path }}
          retention-days: 7

      # -------------------------------------------------------
      # Commit optionnel du fichier chiffré dans le repo
      # -------------------------------------------------------
      - name: Commiter le fichier chiffré
        if: >
          github.event_name == 'push' ||
          github.event.inputs.commit_result == 'true'
        run: |
          ENC="${{ steps.vars.outputs.enc_path }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$ENC"

          # Ne commite que s'il y a réellement un changement
          if git diff --cached --quiet; then
            echo "Aucun changement détecté — commit ignoré."
          else
            git commit -m "chore(crypto): mise à jour du fichier chiffré [skip ci]"
            git push
            echo "Fichier chiffré commité avec succès."
          fi
